name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Start Docker Compose stack
        run: docker compose up --build -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health; then
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Wait for web health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/; then
              exit 0
            fi
            sleep 5
          done
          echo "Web did not become healthy in time"
          docker compose logs
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Collect Docker Compose logs
        if: failure()
        run: docker compose logs > compose-logs.txt

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down stack
        if: always()
        run: docker compose down -v
