name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: apartments
          POSTGRES_PASSWORD: apartments_dev_password
          POSTGRES_DB: apartments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apartments -d apartments_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: apartments
      POSTGRES_PASSWORD: apartments_dev_password
      POSTGRES_DB: apartments_test
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret-minimum-length
      JWT_EXPIRES_IN: 1h
      ADMIN_EMAIL: admin@nawy.local
      ADMIN_PASSWORD: change-me-too
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 100
      THROTTLE_LOGIN_TTL_MS: 60000
      THROTTLE_LOGIN_LIMIT: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: API integration tests
        run: npm run test:integration --workspace apps/api

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            npm-debug.log*
            **/*.log
          if-no-files-found: ignore
